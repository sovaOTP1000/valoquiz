<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VALORANT エージェント名前クイズ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;900&display=swap">
<style>
:root{
  --bg:#0f1923;--panel:#1a2633;--text:#ece8e1;--sub:#8b97a4;--line:#2c3a4a;
  --accent:#ff4655;--ok:#3ddc97;--ng:#ff4655;--btn:#202e3d;--btn-h:#2a3b4e;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f1eee8;--panel:#1a2633;--text:#17212b;--sub:#5d6a77;--line:#cfcac0;
    --accent:#d93644;--ok:#118a5a;--ng:#d93644;--btn:#ffffff;--btn-h:#e7e3da;
    color-scheme:light;
  }
}
:root[data-theme="dark"]{--bg:#0f1923;--text:#ece8e1;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 28px}
.bar{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--sub)}
.track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .3s}
.stage{margin-top:12px;background:linear-gradient(180deg,#1f2c3a,#141e29);border-radius:14px;height:min(46vh,430px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
h1{font-size:19px;font-weight:900;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{font:inherit;font-size:17px;font-weight:900;color:var(--text);background:var(--btn);border:2px solid var(--line);border-radius:10px;padding:16px 6px;cursor:pointer;min-height:58px}
.opt:hover:not(:disabled){background:var(--btn-h)}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .ja{display:block}
.opt .en{display:block;margin-top:3px;font-size:13px;font-weight:500;color:var(--sub);letter-spacing:.02em}
#tm{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;color:var(--text)}
.time{font-size:16px;color:var(--sub);margin:12px 0 0}
.time b{color:var(--text);font-size:22px;font-variant-numeric:tabular-nums}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--btn))}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 22%,var(--btn))}
.fb{min-height:30px;margin-top:14px;font-size:18px;font-weight:900;text-align:center}
.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.go{display:block;width:100%;margin-top:6px;font:inherit;font-size:17px;font-weight:900;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:15px;cursor:pointer}
.go[hidden]{display:none}
.res{text-align:center;padding-top:30px}
.score{font-size:72px;font-weight:900;line-height:1}
.score small{font-size:26px;color:var(--sub)}
.msg{font-size:18px;margin:14px 0 22px}
.miss{text-align:left;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 20px;font-size:15px;line-height:1.7}
.miss b{display:block;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>

const app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let order, idx, score, missed, answered, t0, timer;
const EN = {"ジェット":"Jett","レイズ":"Raze","フェニックス":"Phoenix","レイナ":"Reyna","ヨル":"Yoru","ネオン":"Neon","ブリーチ":"Breach","ソーヴァ":"Sova","スカイ":"Skye","KAY/O":"KAY/O","フェイド":"Fade","オーメン":"Omen","ヴァイパー":"Viper","アストラ":"Astra","ブリムストーン":"Brimstone","セージ":"Sage","サイファー":"Cypher","キルジョイ":"Killjoy","チェンバー":"Chamber","ウェイレイ":"Waylay","ミクス":"Miks","ハッシュ":"Hush","ヴァイス":"Vyse","ヴィトー":"Veto","テホ":"Tejo","ハーバー":"Harbor","ゲッコー":"Gekko","デッドロック":"Deadlock","アイソ":"Iso","クローブ":"Clove"};
const lab = n => `${n}（${EN[n]}）`;
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const elapsed = () => Math.floor((Date.now() - t0) / 1000);

function start() {
  order = shuffle(DATA.map((_, i) => i));
  idx = 0; score = 0; missed = []; answered = false;
  t0 = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { const e = document.getElementById("tm"); if (e) e.textContent = fmt(elapsed()); }, 250);
  show();
}

function show() {
  if (idx >= order.length) return result();
  const c = DATA[order[idx]];
  const others = shuffle(DATA.filter(d => d !== c)).slice(0, 3);
  const choices = shuffle([c, ...others]);
  answered = false;
  app.innerHTML = `
    <div class="bar"><span>${idx + 1} / ${order.length}</span><div class="track"><div class="fill" style="width:${idx / order.length * 100}%"></div></div><span>正解 ${score}</span><span id="tm">${fmt(elapsed())}</span></div>
    <div class="stage"><img alt="このキャラの名前は？" src="${c.i}"></div>
    <h1>このキャラの名前は？</h1>
    <div class="grid">${choices.map(x => `<button class="opt" data-n="${x.n}"><span class="ja">${x.n}</span><span class="en">${EN[x.n]}</span></button>`).join("")}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="go" id="next" hidden>${idx + 1 === order.length ? "結果を見る" : "次へ"}</button>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b, c));
  document.getElementById("next").onclick = () => { idx++; show(); };
}

function answer(btn, c) {
  if (answered) return;
  answered = true;
  const right = btn.dataset.n === c.n;
  app.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.n === c.n) b.classList.add("ok");
  });
  const fb = document.getElementById("fb");
  if (right) { score++; fb.textContent = "正解！ " + lab(c.n); fb.className = "fb ok"; }
  else { btn.classList.add("ng"); missed.push(c.n); fb.textContent = "ざんねん！ 正解は " + lab(c.n); fb.className = "fb ng"; }
  const nx = document.getElementById("next");
  nx.hidden = false; nx.focus({preventScroll:true});
}

function result() {
  clearInterval(timer);
  const total = elapsed();
  const r = score / order.length;
  const msg = r === 1 ? "全問正解！ 完璧です" : r >= 0.8 ? "すごい！ ほぼ覚えています" : r >= 0.5 ? "いい調子！ あと少しです" : "まだこれから。もう一度やってみよう";
  app.innerHTML = `<div class="res">
    <div class="score">${score}<small> / ${order.length}</small></div>
    <p class="time">かかった時間 <b>${fmt(total)}</b>（1問あたり約${Math.round(total / order.length)}秒）</p>
    <p class="msg">${msg}</p>
    ${missed.length ? `<div class="miss"><b>まちがえたキャラ</b>${missed.map(lab).join("、")}</div>` : ""}
    <button class="go" id="again">もう一度</button></div>`;
  document.getElementById("again").onclick = start;
}
start();
</script>
